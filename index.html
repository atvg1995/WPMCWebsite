<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WPMC | Community Media</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero" role="banner">
    <div class="hero__overlay"></div>
    <div class="hero__content">
      <p class="hero__kicker">Woburn Public Media Center</p>
      <h1>Woburn’s Home for Community Media</h1>
      <p class="hero__subheadline">

      <div class="hero__actions" aria-label="Primary actions">
        <a class="btn btn--primary" href="#">Watch Live</a>
        <a class="btn btn--secondary" href="#">Become a Member</a>
      </div>
    </div>
  </header>
